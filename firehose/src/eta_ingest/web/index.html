<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>항공기 입항 시간 예측</title>
<link rel="icon" href="data:,">

<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --border: #dfe3e8;
  --text: #16191d;
  --muted: #666e79;
  --accent: #1f6feb;
  --accent-soft: #e8f0fe;
  --late: #b3261e;
  --late-soft: #fce8e6;
  --early: #1a6b40;
  --early-soft: #e3f3ea;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1c2024; --border: #2f353c; --text: #e8eaed;
    --muted: #9aa3ad; --accent: #63a0ff; --accent-soft: #1b2c47;
    --late: #ff8a80; --late-soft: #3a1f1d; --early: #7ddba4; --early-soft: #17301f;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", Roboto, sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
h2 { font-size: 14px; margin: 0 0 12px; font-weight: 650; }
.spacer { flex: 1 1 auto; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
  border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
  max-width: min(62ch, 100%); min-width: 0;
}
#statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill .dot { flex: none; }
.pill.off { background: var(--border); color: var(--muted); }
.pill.bad { background: var(--late-soft); color: var(--late); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.on .dot { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

button {
  padding: 8px 15px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font: inherit; font-weight: 600;
  font-size: 13px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { opacity: .9; color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

.tabs { display: flex; gap: 4px; margin-bottom: 14px; }
.tab {
  padding: 7px 14px; border-radius: 7px; border: 1px solid transparent;
  background: none; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 13px;
}
.tab[aria-selected="true"] { background: var(--panel); border-color: var(--border); color: var(--text); }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 700; padding: 0 10px 8px; border-bottom: 1px solid var(--border);
}
td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.strong { font-weight: 650; }
.muted { color: var(--muted); }

.delta { font-variant-numeric: tabular-nums; font-weight: 650; padding: 2px 7px; border-radius: 5px; }
.delta.late { background: var(--late-soft); color: var(--late); }
.delta.early { background: var(--early-soft); color: var(--early); }
.delta.same { color: var(--muted); }

.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.error {
  background: var(--late-soft); color: var(--late); padding: 10px 12px;
  border-radius: 7px; font-size: 13px; margin-bottom: 12px;
}

dialog {
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  color: var(--text); padding: 18px; max-width: 520px; width: calc(100% - 32px);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
.trail { list-style: none; margin: 0; padding: 0; }
.trail li {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.trail li:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>항공기 입항 시간 예측</h1>
  <span id="status" class="pill off"><span class="dot"></span><span id="statusText">확인 중</span></span>
  <span class="spacer"></span>
  <button id="toggle" class="primary" disabled>수집 시작</button>
</header>

<div id="alert" class="error" hidden></div>

<section class="card">
  <h2>연결 설정</h2>
  <div class="grid">
    <div>
      <label for="user">Firehose 사용자명</label>
      <input id="user" autocomplete="username" placeholder="FlightAware 계정">
    </div>
    <div>
      <label for="pass">Firehose API Key</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="계정 비밀번호가 아닙니다">
    </div>
    <div>
      <label for="key">공공데이터 서비스키 <span class="muted">(대조용, 선택)</span></label>
      <input id="key" type="password" placeholder="인천공항 도착정보 대조에만 사용">
    </div>
    <div>
      <label for="airlines">대상 항공사</label>
      <input id="airlines" placeholder="WE, 8M, AS, AA, WS">
    </div>
    <div>
      <label for="airport">도착 공항</label>
      <input id="airport" placeholder="ICN">
    </div>
  </div>
  <div class="actions">
    <button id="save" class="primary">저장하고 수집 시작</button>
    <span id="saveHint" class="hint"></span>
  </div>
  <p class="hint">
    입력값은 이 컴퓨터의 DB 파일에만 저장되고(권한 0600) 화면으로 다시 내려오지 않습니다.
    Firehose 는 브라우저가 열 수 없는 TLS 소켓을 쓰기 때문에 이 서버가 대신 접속합니다.
  </p>
</section>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-view="arrivals">도착 예정편</button>
  <button class="tab" role="tab" aria-selected="false" data-view="compare">공공데이터 대조</button>
</div>

<section class="card">
  <div class="actions" style="margin: 0 0 14px;">
    <label for="hours" style="margin: 0;">조회 범위</label>
    <input id="hours" type="number" min="1" max="72" value="12" style="width: 74px;">
    <span class="hint">시간 이내 도착</span>
    <span class="spacer"></span>
    <button id="refresh">새로고침</button>
  </div>
  <div id="body" class="scroll"><p class="empty">불러오는 중…</p></div>
</section>

</div>

<dialog id="trailDialog">
  <h2 id="trailTitle">ETA 변경 이력</h2>
  <ul id="trail" class="trail"></ul>
  <div class="actions"><button id="closeTrail">닫기</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const KST = "Asia/Seoul";
let view = "arrivals";
let state = {};

const parts = (epoch) => {
  const f = new Intl.DateTimeFormat("ko-KR", {
    timeZone: KST, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date(epoch * 1000));
  return Object.fromEntries(f.map((p) => [p.type, p.value]));
};

// 시각만 쓰면 다른 날짜(체험 계정의 과거 데이터 등)를 오늘 편으로 오해합니다.
const hhmm = (epoch) => {
  if (!epoch) return "—";
  const t = parts(epoch);
  const today = parts(Date.now() / 1000);
  const time = `${t.hour}:${t.minute}`;
  if (t.year === today.year && t.month === today.month && t.day === today.day) return time;
  if (t.year === today.year) return `${t.month}-${t.day} ${time}`;
  return `${t.year}-${t.month}-${t.day} ${time}`;
};

const ago = (epoch) => {
  const secs = Math.max(0, Math.round(Date.now() / 1000 - epoch));
  if (secs < 60) return `${secs}초 전`;
  if (secs < 3600) return `${Math.round(secs / 60)}분 전`;
  return `${Math.round(secs / 3600)}시간 전`;
};

const esc = (value) => String(value ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function delta(minutes) {
  if (minutes === null || minutes === undefined) return '<span class="muted">—</span>';
  const cls = minutes > 2 ? "late" : minutes < -2 ? "early" : "same";
  const sign = minutes > 0 ? "+" : "";
  return `<span class="delta ${cls}">${sign}${minutes}분</span>`;
}

function alertBox(message) {
  $("alert").hidden = !message;
  $("alert").textContent = message || "";
}

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
  return payload;
}

async function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}

// ------------------------------------------------------------------ 상태 표시
async function refreshStatus() {
  try {
    state = await api("/api/status");
  } catch (err) {
    return alertBox(`서버에 연결할 수 없습니다: ${err.message}`);
  }
  const pill = $("status");
  const running = state.running;
  const trouble = state.last_error || (running && !state.last_message_at && state.connect_error);
  pill.className = `pill ${trouble ? "bad" : running ? "on" : "off"}`;
  pill.title = trouble || "";
  $("statusText").textContent = trouble
    ? `${state.last_error ? "중단됨" : "접속 재시도 중"} · ${trouble}`
    : running
      ? state.last_message_at
        ? `수집 중 · ${state.stored.toLocaleString()}건 적재 · 마지막 수신 ${ago(state.last_message_at)}`
        : "접속 중… 첫 메시지를 기다리는 중입니다"
      : state.configured ? "중지됨" : "설정 필요";
  $("toggle").textContent = running ? "수집 중지" : "수집 시작";
  $("toggle").disabled = !state.configured;
  $("toggle").className = running ? "" : "primary";
}

// ------------------------------------------------------------------ 표 렌더링
function renderArrivals(data) {
  if (!data.flights.length) {
    const stored = data.stored || {};
    if (stored.total) {
      // 수집은 됐지만 전부 조회 범위 밖인 경우 — 체험 계정이 과거 데이터를 재생하면 이렇게 됩니다.
      return `<p class="empty">
        <strong>${stored.total}편을 받았지만 모두 조회 범위 밖입니다.</strong><br>
        받은 도착시각: ${hhmm(stored.first_eta)} ~ ${hhmm(stored.last_eta)}<br>
        <span class="muted">Firehose 계정이 과거 데이터를 재생(replay)하고 있을 수 있습니다.
        FlightAware 에 체험 계정이 실시간 데이터를 받는지 확인해 보세요.</span>
      </p>`;
    }
    return `<p class="empty">${state.running
      ? "아직 수신된 도착편이 없습니다. 스트림이 붙는 데 몇 분 걸릴 수 있습니다."
      : "수집을 시작하면 도착편이 표시됩니다."}</p>`;
  }
  const rows = data.flights.map((f) => {
    const scheduled = f.scheduled_on || f.scheduled_in;
    const drift = scheduled && f.eta ? Math.round((f.eta - scheduled) / 60) : null;
    return `<tr class="clickable" data-flight="${esc(f.flight_id)}">
      <td class="strong">${esc(f.ident)}</td>
      <td class="mono">${esc(f.orig || "—")}</td>
      <td class="num">${hhmm(scheduled)}</td>
      <td class="num strong">${hhmm(f.eta)}</td>
      <td>${delta(drift)}</td>
      <td class="muted">${esc(f.eta_source || "—")}</td>
      <td>${esc(f.estimated_arrival_gate || f.actual_arrival_gate || "—")}</td>
      <td>${esc(f.baggage_claim || "—")}</td>
      <td class="mono muted">${esc(f.reg || "—")}</td>
    </tr>`;
  }).join("");
  return `<table><thead><tr>
      <th>편명</th><th>출발</th><th>예정</th><th>도착 예정(ETA)</th><th>지연</th>
      <th>ETA 출처</th><th>게이트</th><th>수취대</th><th>기재</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">행을 누르면 ETA 가 어떻게 바뀌어 왔는지 볼 수 있습니다.</p>`;
}

function renderCompare(data) {
  if (!data.rows.length) return `<p class="empty">대조할 도착편이 없습니다.</p>`;
  const rows = data.rows.map((r) => {
    const iia = r.iia;
    return `<tr>
      <td class="strong">${esc(r.ident)}</td>
      <td class="mono muted">${esc(r.reg || "—")}</td>
      <td class="num strong">${hhmm(r.firehose.eta)}</td>
      <td class="num">${hhmm(iia && (iia.estimated || iia.scheduled))}</td>
      <td>${delta(r.diff_minutes)}</td>
      <td>${esc(r.firehose.gate || "—")} <span class="muted">/ ${esc(iia && iia.gate || "—")}</span></td>
      <td>${esc(r.firehose.carousel || "—")} <span class="muted">/ ${esc(iia && iia.carousel || "—")}</span></td>
      <td class="muted">${esc(iia && iia.remark || "—")}</td>
      <td class="muted">${r.matched_by === "reg" ? "기재번호" : r.matched_by === "flight_no" ? "편명" : "매칭 실패"}</td>
    </tr>`;
  }).join("");
  return `<p class="hint" style="margin-top:0">
      ${esc(data.date).replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3")} 기준 ·
      ${data.total}편 중 ${data.matched}편 대조 성공.
      <strong>차이</strong>는 Firehose ETA 에서 공공데이터 예상시각을 뺀 값입니다 (+ 는 Firehose 가 더 늦게 봄).
      게이트·수취대는 <strong>Firehose / 공공데이터</strong> 순입니다.
    </p>
    <div class="scroll"><table><thead><tr>
      <th>편명</th><th>기재</th><th>Firehose ETA</th><th>공공데이터</th><th>차이</th>
      <th>게이트</th><th>수취대</th><th>현황</th><th>대조 근거</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function load() {
  const hours = Math.max(1, Math.min(72, Number($("hours").value) || 12));
  $("body").innerHTML = `<p class="empty">불러오는 중…</p>`;
  try {
    if (view === "arrivals") {
      $("body").innerHTML = renderArrivals(await api(`/api/arrivals?hours=${hours}`));
    } else {
      $("body").innerHTML = renderCompare(await api(`/api/compare?hours=${hours}`));
    }
    alertBox("");
  } catch (err) {
    $("body").innerHTML = `<p class="empty">${esc(err.message)}</p>`;
  }
}

// ------------------------------------------------------------------ 이벤트
$("save").addEventListener("click", async () => {
  $("save").disabled = true;
  $("saveHint").textContent = "저장 중…";
  try {
    await post("/api/config", {
      firehose_username: $("user").value,
      firehose_password: $("pass").value,
      data_go_kr_key: $("key").value,
      airlines: $("airlines").value,
      airport: $("airport").value,
    });
    $("pass").value = "";
    $("key").value = "";
    const result = await post("/api/ingest/start");
    $("saveHint").textContent = result.started ? "저장했습니다. 수집을 시작합니다." : "저장했습니다.";
    alertBox("");
  } catch (err) {
    $("saveHint").textContent = "";
    alertBox(err.message);
  } finally {
    $("save").disabled = false;
    await refreshStatus();
    await load();
  }
});

$("toggle").addEventListener("click", async () => {
  $("toggle").disabled = true;
  try {
    await post(state.running ? "/api/ingest/stop" : "/api/ingest/start");
    if (state.running) alertBox("중지를 요청했습니다. 다음 메시지 수신 시 완전히 멈춥니다(최대 1분).");
  } catch (err) {
    alertBox(err.message);
  } finally {
    await refreshStatus();
  }
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
    view = tab.dataset.view;
    load();
  });
});

$("refresh").addEventListener("click", load);
$("hours").addEventListener("change", load);
$("closeTrail").addEventListener("click", () => $("trailDialog").close());

$("body").addEventListener("click", async (event) => {
  const row = event.target.closest("tr[data-flight]");
  if (!row) return;
  try {
    const data = await api(`/api/history?flight_id=${encodeURIComponent(row.dataset.flight)}`);
    $("trailTitle").textContent = `${data.flight.ident} · ETA 변경 이력`;
    $("trail").innerHTML = data.eta_history.length
      ? data.eta_history.map((h) => `<li>
          <span class="muted">${esc(h.msg_type)} · ${esc(h.source)}</span>
          <span class="num strong">${hhmm(h.eta)}</span>
        </li>`).join("")
      : `<li class="muted">아직 변경 이력이 없습니다.</li>`;
    $("trailDialog").showModal();
  } catch (err) {
    alertBox(err.message);
  }
});

// ------------------------------------------------------------------ 초기화
(async function init() {
  try {
    const config = await api("/api/config");
    $("user").value = config.firehose_username || "";
    $("airlines").value = (config.airlines || config.default_airlines).join(", ");
    $("airport").value = config.airport || "ICN";
    $("pass").placeholder = config.has_firehose_password ? "저장됨 — 바꿀 때만 입력" : "계정 비밀번호가 아닙니다";
    $("key").placeholder = config.has_data_go_kr_key ? "저장됨 — 바꿀 때만 입력" : "인천공항 도착정보 대조에만 사용";
  } catch (err) {
    alertBox(err.message);
  }
  await refreshStatus();
  await load();
  setInterval(refreshStatus, 5000);
  setInterval(() => { if (state.running) load(); }, 30000);
})();
</script>
</body>
</html>
